; ESP32 BLE game controller firmware.
; Two builds of the same firmware; they differ only in the serial log.
;   release (default)  what stays on the controller: pio run -t upload
;   debug              + serial log (BLE pairing, battery, power, saves): pio run -e debug -t upload,
;                      then pio device monitor

[platformio]
default_envs = release

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Like huge_app.csv (app at 0x10000), but the settings store (NVS) is 128 KB, placed after the app.
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; NimBLE: the GAP Appearance characteristic says "gamepad" (default 0 = unknown); hosts read it after connecting.
    -D CONFIG_BT_NIMBLE_SVC_GAP_APPEARANCE=0x03C4
    ; NimBLE keeps each paired host's subscriptions (7 here: 5 HID reports, battery, service changed). The default
    ; room (8) fits one host; 24 covers the 3 pairings NimBLE keeps.
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=24
; ESP32-BLE-CompositeHID is vendored with local changes in lib/ (see lib/ESP32-BLE-CompositeHID/VENDORED.md).
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    tomstewart89/Callback @ 1.1
    olikraus/U8g2 @ 2.36.18
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library @ 1.0.4

[env:release]

[env:debug]
build_flags =
    ${env.build_flags}
    ; Enables LOG() and the BLE diagnostics.
    -D CONTROLLER_DEBUG
